[phases.setup]
nixPkgs = ["openssl"]

[build]
builder = "NIXPACKS"
buildCommand = "cd server && npm ci --foreground-scripts && npm run prisma:generate && npm run build && cd ../client && npm ci --foreground-scripts && npm run build"

[deploy]
preDeployCommand = "cd server && npm run prisma:push"
startCommand = "cd server && npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
